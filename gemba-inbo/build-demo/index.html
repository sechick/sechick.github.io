<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staged-build demo — NIO / Better Place</title>
<style>
  :root{--paper:#FBFBFA;--ink:#131312;--muted:#71716A;--hair:#E4E4DE;--true:#1E7A4F;
    --sans:"Helvetica Neue",Helvetica,"Arial Nova",Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
    padding:.6rem clamp(.8rem,2.5vw,1.6rem);border-bottom:1px solid var(--hair)}
  .kicker{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .title{font-size:.9rem;font-weight:700}
  .counter{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:clamp(.5rem,2vw,1.4rem);min-height:0}
  .box{position:relative;aspect-ratio:16/9;height:100%;max-width:100%;width:auto;background:#fff;border:1px solid var(--hair);
    box-shadow:0 1px 0 var(--hair),0 18px 50px -28px rgba(0,0,0,.5)}
  .box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;
    transition:opacity .45s cubic-bezier(.2,.7,.2,1)}
  .nav{position:absolute;top:0;bottom:0;width:16%;border:0;background:transparent;cursor:pointer;z-index:9}
  .nav.prev{left:0}.nav.next{right:0}
  .nav span{display:inline-flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;border-radius:50%;
    background:rgba(255,255,255,.85);border:1px solid var(--hair);font-size:1.1rem}
  .bar{flex:0 0 auto;border-top:1px solid var(--hair);padding:.5rem clamp(.8rem,2.5vw,1.6rem);
    display:flex;align-items:center;gap:.8rem}
  .dots{display:flex;gap:.4rem}
  .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--hair)}
  .dot.on{background:var(--true)}
  .label{font-size:.78rem;color:var(--muted)}
  .hint{font-size:.62rem;color:var(--muted);letter-spacing:.05em;margin-left:auto}
</style>
</head>
<body>
<header>
  <div>
    <div class="kicker">GEMBA · INBM 2026 · staged-build demo</div>
    <div class="title" id="title">Sample slide</div>
  </div>
  <div class="counter"><span id="which">1</span> of <span id="total">2</span> samples</div>
</header>
<div class="stage">
  <div class="box" id="box"></div>
  <button class="nav prev" id="prev" aria-label="Back"><span>&#8249;</span></button>
  <button class="nav next" id="next" aria-label="Forward"><span>&#8250;</span></button>
</div>
<div class="bar">
  <div class="dots" id="dots"></div>
  <div class="label" id="label">build 1 / 6</div>
  <div class="hint">&#8592;/&#8594; or Space or click sides · each click reveals the next build</div>
</div>
<script>
const DECKS=[
  {title:"Slide 16 — staged text build (5 clicks)",
   frames:["frames/s16-0.png","frames/s16-1.png","frames/s16-2.png","frames/s16-3.png","frames/s16-4.png","frames/s16-5.png"]},
  {title:"Slide 41 — “Fidelity vs Efficiency” canvas build (5 clicks)",
   frames:["frames/s42-0.png","frames/s42-1.png","frames/s42-2.png","frames/s42-3.png","frames/s42-4.png","frames/s42-5.png"]}
];
const box=document.getElementById('box'),dots=document.getElementById('dots');
let di=0, step=0, imgs=[];
document.getElementById('total').textContent=DECKS.length;
function loadDeck(){
  box.innerHTML=''; imgs=[];
  const d=DECKS[di];
  d.frames.forEach((src,k)=>{const im=document.createElement('img');im.src=src;im.style.zIndex=k;im.alt='build '+k;box.appendChild(im);imgs.push(im);});
  dots.innerHTML=''; d.frames.forEach(()=>{const s=document.createElement('div');s.className='dot';dots.appendChild(s);});
  document.getElementById('title').textContent=d.title;
  document.getElementById('which').textContent=di+1;
  draw();
}
function draw(){
  imgs.forEach((im,k)=>im.style.opacity=(k<=step)?'1':'0');
  [...dots.children].forEach((s,k)=>s.classList.toggle('on',k<=step));
  document.getElementById('label').textContent='build '+(step+1)+' / '+DECKS[di].frames.length;
  document.getElementById('prev').style.opacity=(di===0&&step===0)?'.3':'1';
  document.getElementById('next').style.opacity=(di===DECKS.length-1&&step===DECKS[di].frames.length-1)?'.3':'1';
}
function fwd(){const last=DECKS[di].frames.length-1;
  if(step<last)step++; else if(di<DECKS.length-1){di++;step=0;loadDeck();return;} draw();}
function back(){if(step>0)step--; else if(di>0){di--;step=DECKS[di].frames.length-1;loadDeck();return;} draw();}
document.getElementById('next').onclick=fwd;
document.getElementById('prev').onclick=back;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();fwd();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();back();}
  else if(e.key==='Home'){di=0;step=0;loadDeck();}
});
loadDeck();
</script>
</body>
</html>
