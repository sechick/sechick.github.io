<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Levers — Idea Factory Walkthrough</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#FFFFFF;
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:#131312;
    overflow:hidden;
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c" aria-label="Animated diagram: ideas are draws from a vertical quality distribution and fly right at the quality they were drawn at. A wall marks the quality hurdle; only top-tail draws clear it. Four levers change the picture: take more draws, shift the mean, raise the variance, evaluate better."></canvas>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var COLORS = {
    ink:    "#131312",
    muted:  "#71716A",
    hair:   "#E4E4DE",
    red:    "#C8361F",
    green:  "#1E7A4F",
    paper:  "#FFFFFF"
  };
  var FONT = "-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif";

  // ---------- lever states (normalized: fractions of H, spawns per second) ----------
  var BASE = { mean: 0.52, sig: 0.105, band: 0.0525, rate: 2.4 };
  var STATES = [
    { name: "Baseline",
      sub:  "A fixed quality bar. Most draws fall short; the top tail clears.",
      p: { mean: 0.52,  sig: 0.105, band: 0.0525, rate: 2.4 } },
    { name: "Lever 1: take more draws",
      sub:  "Same distribution, four times the draws. More shots at the tail.",
      p: { mean: 0.52,  sig: 0.105, band: 0.0525, rate: 9.6 } },
    { name: "Lever 2: shift the mean",
      sub:  "Better inputs lift the whole distribution. More of it sits above the bar.",
      p: { mean: 0.436, sig: 0.105, band: 0.0525, rate: 2.4 } },
    { name: "Lever 3: raise the variance",
      sub:  "Wilder ideas: more duds and more clears. The tails are where you win.",
      p: { mean: 0.52,  sig: 0.168, band: 0.0525, rate: 2.4 } },
    { name: "Lever 4: evaluate better",
      sub:  "Sharper judgment narrows the noise band. The gate becomes exact.",
      p: { mean: 0.52,  sig: 0.105, band: 0.004,  rate: 2.4 } }
  ];

  // ---------- state ----------
  var W = 0, H = 0, dpr = 1;
  var G = {};
  var particles = [];
  var pile = [];        // settled dud dots
  var fadingPile = [];  // previous state's pile dissolving
  var puffs = [];       // gray rings on wall hits
  var sparks = [];      // green sparks on clears
  var flashes = [];     // red rings: a below-bar idea sneaks over
  var xmarks = [];      // red X: an above-bar idea gets killed
  var slots = [];
  var sampled = 0, cleared = 0;
  var spawnTimer = 0.5;
  var time = 0;
  var labelFade = 1;
  var stateIdx = 0;
  var running = true;
  var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // animated params + tween
  var cur = { mean: BASE.mean, sig: BASE.sig, band: BASE.band, rate: BASE.rate };
  var twFrom = null, twTo = null, twT = 1;
  var TW_DUR = 0.8;

  // ---------- helpers ----------
  function randn(){ // Box-Muller
    var u = 0, v = 0;
    while(u === 0) u = Math.random();
    while(v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
  function lerp(a, b, t){ return a + (b - a) * t; }
  function easeInOut(t){
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  // ---------- geometry ----------
  // Higher on screen = higher quality. The hurdle is FIXED in screen space at
  // 1.55 sigma above the BASELINE mean; the distribution moves under it.
  function computeGeometry(){
    G.axisX   = 0.160 * W;
    G.axisTop = 0.178 * H;
    G.axisBot = 0.875 * H;
    G.ground  = 0.905 * H;
    G.wallL   = 0.780 * W;
    G.wallW   = 0.016 * W;
    G.wallTop = (BASE.mean - 1.55 * BASE.sig) * H;
    G.gateX   = G.wallL - 0.045 * W;

    G.bulge0 = 0.125 * W;
    G.rIdea  = 0.0075 * W;
    G.rPile  = 0.0085 * W;

    G.spawnMin = G.axisTop + 0.012 * H;
    G.spawnMax = G.axisBot - 0.008 * H;

    // pile slots: heap with its right edge flush against the wall
    slots = [];
    var rows = 9, r = G.rPile;
    for (var j = 0; j < rows; j++){
      var count = rows - j;
      for (var k = 0; k < count; k++){
        slots.push({
          x: G.wallL - r - k * (r * 2.04),
          y: G.ground - r - j * (r * 1.78),
          filled: false
        });
      }
    }
  }

  function resize(){
    var vw = window.innerWidth  || document.documentElement.clientWidth;
    var vh = window.innerHeight || document.documentElement.clientHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = vw; H = vh;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    computeGeometry();
    pile = []; fadingPile = [];
    if (!running || reduceMotion){
      if (reduceMotion) buildVignette();
      draw();
    }
  }
  window.addEventListener("resize", resize);

  // ---------- distribution ----------
  function ampPx(){ return G.bulge0 * (BASE.sig / cur.sig); } // equal area
  function bulgeAt(y, meanPx, sigPx, amp){
    var d = (y - meanPx) / sigPx;
    return amp * Math.exp(-0.5 * d * d);
  }
  function tracePdf(meanPx, sigPx, amp){
    ctx.beginPath();
    ctx.moveTo(G.axisX, G.axisBot);
    for (var y = G.axisBot; y >= G.axisTop; y -= 2){
      ctx.lineTo(G.axisX + bulgeAt(y, meanPx, sigPx, amp), y);
    }
    ctx.lineTo(G.axisX, G.axisTop);
  }

  // ---------- particles ----------
  function spawn(){
    var meanPx = cur.mean * H, sigPx = cur.sig * H;
    var y0, tries = 0;
    do {
      y0 = meanPx + randn() * sigPx;
      tries++;
    } while ((y0 < G.spawnMin || y0 > G.spawnMax) && tries < 60);
    y0 = clamp(y0, G.spawnMin, G.spawnMax);
    particles.push({
      x: G.axisX + bulgeAt(y0, meanPx, sigPx, ampPx()),
      y: y0,
      baseY: y0,
      vx: (0.115 + 0.055 * Math.random()) * W,
      vy: 0,
      judged: false,
      pass: false,
      mistake: null,     // "pass" = sneaked over, "kill" = good idea rejected
      sneakTarget: null,
      resolved: false,
      counted: false,
      dying: false,
      state: "flying",
      slot: null,
      phase: Math.random() * Math.PI * 2,
      age: 0,
      alpha: 1,
      trail: []
    });
    sampled++;
  }

  function nextSlot(){
    for (var i = 0; i < slots.length; i++)
      if (!slots[i].filled) return slots[i];
    return null;
  }

  function judge(p){
    p.judged = true;
    var bh = cur.band * H;
    var dY = p.baseY - G.wallTop; // positive = below the hurdle
    if (dY < -bh){
      p.pass = true;             // clearly above the bar
    } else if (dY > bh){
      p.pass = false;            // clearly below the bar
    } else {
      p.pass = Math.random() < 0.5;   // inside the noise band: coin flip
      if (p.pass && dY > 0){
        p.mistake = "pass";           // a dud sneaks over
        p.sneakTarget = G.wallTop - 0.032 * H;
        flashes.push({ x: p.x, y: p.y, t: 0 });
      } else if (!p.pass && dY < 0){
        p.mistake = "kill";           // a good idea gets killed at the gate
        xmarks.push({ x: p.x + G.rIdea * 1.6, y: p.y, t: 0 });
        startFall(p, p.x);
      }
    }
  }

  function startFall(p, atX){
    p.x = atX;
    p.state = "falling";
    p.vx = -(0.015 + Math.random() * 0.03) * W;
    p.vy = -(0.02 + Math.random() * 0.05) * H;
    p.slot = p.dying ? null : nextSlot();
    if (p.slot) p.slot.filled = true;
    p.trail = [];
  }

  function update(dt){
    time += dt;

    // tween lever parameters
    if (twT < 1){
      twT = Math.min(1, twT + dt / TW_DUR);
      var e = easeInOut(twT);
      cur.mean = lerp(twFrom.mean, twTo.mean, e);
      cur.sig  = lerp(twFrom.sig,  twTo.sig,  e);
      cur.band = lerp(twFrom.band, twTo.band, e);
      cur.rate = lerp(twFrom.rate, twTo.rate, e);
    }
    if (labelFade < 1) labelFade = Math.min(1, labelFade + 2.2 * dt);

    spawnTimer -= dt;
    if (spawnTimer <= 0){
      spawn();
      spawnTimer = (1 / cur.rate) * (0.8 + 0.4 * Math.random());
    }

    var g = 2.4 * H;

    for (var i = particles.length - 1; i >= 0; i--){
      var p = particles[i];
      p.age += dt;

      if (p.dying){
        p.alpha -= 2.2 * dt;
        if (p.alpha <= 0){ particles.splice(i, 1); continue; }
      }

      if (p.state === "flying"){
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 15) p.trail.shift();

        p.x += p.vx * dt;
        if (p.sneakTarget !== null){
          p.baseY += (p.sneakTarget - p.baseY) * Math.min(1, 9 * dt);
        }
        p.y = p.baseY + Math.sin(time * 2.1 + p.phase) * 0.0025 * H;

        // the evaluation gate sits just before the wall
        if (!p.judged && !p.dying && p.x + G.rIdea >= G.gateX) judge(p);

        if (p.state === "flying" && p.x + G.rIdea >= G.wallL && !p.resolved){
          p.resolved = true;
          if (p.dying){
            // old-state stragglers pass through uncounted, no effects
            if (p.baseY >= G.wallTop) { particles.splice(i, 1); continue; }
          } else if (p.judged && p.pass){
            p.counted = true;
            cleared++;
            burst(G.wallL + G.wallW * 0.5, p.y, p.mistake === "pass");
          } else {
            startFall(p, G.wallL - G.rIdea);
            puffs.push({ x: G.wallL - G.rIdea, y: p.y, t: 0 });
          }
        }
        if (p.x > W + 0.05 * W){ particles.splice(i, 1); continue; }

      } else if (p.state === "falling"){
        p.vy += g * dt;
        p.vx *= Math.pow(0.2, dt);
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        if (p.slot){
          p.x += (p.slot.x - p.x) * Math.min(1, 3.2 * dt);
          if (p.y >= p.slot.y){
            pile.push({ x: p.slot.x, y: p.slot.y });
            particles.splice(i, 1);
            continue;
          }
        } else {
          p.alpha -= 1.6 * dt;
          var top = G.ground - 9 * G.rPile * 1.78;
          if (p.y > top) p.y = top;
          if (p.alpha <= 0){ particles.splice(i, 1); continue; }
        }
        if (p.y > G.ground){ particles.splice(i, 1); continue; }
      }
    }

    for (var f = fadingPile.length - 1; f >= 0; f--){
      fadingPile[f].a -= 1.6 * dt;
      if (fadingPile[f].a <= 0) fadingPile.splice(f, 1);
    }
    for (var j = puffs.length - 1; j >= 0; j--){
      puffs[j].t += dt * 2.4;
      if (puffs[j].t >= 1) puffs.splice(j, 1);
    }
    for (var k = sparks.length - 1; k >= 0; k--){
      var sp = sparks[k];
      sp.t += dt * 1.8;
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
      if (sp.t >= 1) sparks.splice(k, 1);
    }
    for (var m = flashes.length - 1; m >= 0; m--){
      flashes[m].t += dt * 1.5;
      if (flashes[m].t >= 1) flashes.splice(m, 1);
    }
    for (var n = xmarks.length - 1; n >= 0; n--){
      xmarks[n].t += dt * 0.9;
      if (xmarks[n].t >= 1) xmarks.splice(n, 1);
    }
  }

  function burst(x, y, mistaken){
    for (var i = 0; i < 7; i++){
      var a = Math.random() * Math.PI * 2;
      var s = (0.02 + Math.random() * 0.045) * W;
      sparks.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                    t: 0, red: !!mistaken });
    }
  }

  // ---------- lever switching ----------
  function setState(n){
    if (n === stateIdx && twT >= 1) return;
    stateIdx = n;
    twFrom = { mean: cur.mean, sig: cur.sig, band: cur.band, rate: cur.rate };
    twTo = STATES[n].p;
    twT = 0;
    labelFade = 0;

    // honest stats: each state starts its own count
    sampled = 0; cleared = 0;
    spawnTimer = Math.min(spawnTimer, 0.25);

    // previous state's pile dissolves; in-flight particles fade uncounted
    for (var i = 0; i < pile.length; i++)
      fadingPile.push({ x: pile[i].x, y: pile[i].y, a: 1 });
    pile = [];
    for (var s = 0; s < slots.length; s++) slots[s].filled = false;
    for (var j = 0; j < particles.length; j++){
      particles[j].dying = true;
      if (particles[j].slot){ particles[j].slot = null; }
    }

    if (reduceMotion){
      cur.mean = twTo.mean; cur.sig = twTo.sig;
      cur.band = twTo.band; cur.rate = twTo.rate;
      twT = 1; labelFade = 1;
      buildVignette();
      draw();
    }
  }

  // ---------- drawing ----------
  function text(lines, x, y, size, opts){
    opts = opts || {};
    ctx.font = (opts.weight || 400) + " " + size + "px " + FONT;
    ctx.fillStyle = opts.color || COLORS.ink;
    ctx.textAlign = opts.align || "left";
    ctx.textBaseline = "alphabetic";
    var lh = size * 1.25;
    for (var i = 0; i < lines.length; i++)
      ctx.fillText(lines[i], x, y + i * lh);
  }

  function ghostVisible(){
    return Math.abs(cur.mean - BASE.mean) * H > 1 ||
           Math.abs(cur.sig  - BASE.sig)  * H > 1;
  }

  function drawBackdrop(){
    var s = W / 1000;
    var meanPx = cur.mean * H, sigPx = cur.sig * H;
    var bandPx = cur.band * H;

    // judgment noise band: hatched zone around the hurdle
    var bTop = G.wallTop - bandPx, bBot = G.wallTop + bandPx;
    if (bandPx > 0.5){
      ctx.save();
      ctx.beginPath();
      ctx.rect(G.axisX, bTop, G.wallL - G.axisX, bBot - bTop);
      ctx.clip();
      ctx.fillStyle = "rgba(113,113,106,0.07)";
      ctx.fillRect(G.axisX, bTop, G.wallL - G.axisX, bBot - bTop);
      ctx.strokeStyle = "rgba(113,113,106,0.25)";
      ctx.lineWidth = 1;
      var step = 13 * s, span = bBot - bTop;
      for (var hx = G.axisX - span; hx < G.wallL; hx += step){
        ctx.beginPath();
        ctx.moveTo(hx, bBot);
        ctx.lineTo(hx + span, bTop);
        ctx.stroke();
      }
      ctx.restore();
    }
    text(["judgment noise"], 0.415 * W, bTop - 8 * s, 24 * s,
         { color: COLORS.muted });

    // ghost of the baseline distribution (dashed) when the live one moved
    if (ghostVisible()){
      ctx.save();
      ctx.strokeStyle = COLORS.muted;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = Math.max(1, 1.6 * s);
      ctx.setLineDash([7 * s, 6 * s]);
      tracePdf(BASE.mean * H, BASE.sig * H, G.bulge0);
      ctx.stroke();
      ctx.restore();
    }

    // the live quality distribution: quiet fill, green where it beats the bar
    tracePdf(meanPx, sigPx, ampPx());
    ctx.fillStyle = "rgba(19,19,18,0.06)";
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, G.wallTop);
    ctx.clip();
    tracePdf(meanPx, sigPx, ampPx());
    ctx.fillStyle = "rgba(30,122,79,0.22)";
    ctx.fill();
    ctx.restore();
    tracePdf(meanPx, sigPx, ampPx());
    ctx.strokeStyle = COLORS.ink;
    ctx.lineWidth = Math.max(1.3, 1.8 * s);
    ctx.stroke();

    // dashed hurdle line across the field
    ctx.save();
    ctx.strokeStyle = COLORS.muted;
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = Math.max(1, 1.4 * s);
    ctx.setLineDash([6 * s, 7 * s]);
    ctx.beginPath();
    ctx.moveTo(G.axisX, G.wallTop);
    ctx.lineTo(G.wallL, G.wallTop);
    ctx.stroke();
    ctx.restore();

    // axis with arrow
    ctx.strokeStyle = COLORS.ink;
    ctx.lineWidth = Math.max(1.4, 2 * s);
    ctx.beginPath();
    ctx.moveTo(G.axisX, G.axisBot);
    ctx.lineTo(G.axisX, G.axisTop - 0.012 * H);
    ctx.stroke();
    var ah = 0.011 * W;
    var tipY = G.axisTop - 0.012 * H;
    ctx.beginPath();
    ctx.moveTo(G.axisX, tipY - ah * 0.7);
    ctx.lineTo(G.axisX - ah * 0.55, tipY + ah);
    ctx.lineTo(G.axisX + ah * 0.55, tipY + ah);
    ctx.closePath();
    ctx.fillStyle = COLORS.ink;
    ctx.fill();

    // axis labels
    text(["Higher quality"], G.axisX + 0.014 * W, G.axisTop - 0.004 * H, 24 * s,
         { weight: 600 });
    text(["Lower quality"], G.axisX + 0.014 * W, G.axisBot + 0.032 * H, 24 * s,
         { weight: 600 });

    // field labels
    text(["Quality", "hurdle"], G.wallL + G.wallW + 0.014 * W,
         G.wallTop + 0.075 * H, 24 * s, { color: COLORS.muted });
    text(["exceptional ideas"], 0.884 * W, G.wallTop - 0.055 * H, 24 * s,
         { align: "center", color: COLORS.green, weight: 600 });

    // ground
    ctx.strokeStyle = COLORS.ink;
    ctx.lineWidth = Math.max(2, 3 * s);
    ctx.beginPath();
    ctx.moveTo(0.345 * W, G.ground + 1.5 * s);
    ctx.lineTo(W, G.ground + 1.5 * s);
    ctx.stroke();

    // wall
    ctx.fillStyle = COLORS.ink;
    ctx.fillRect(G.wallL, G.wallTop, G.wallW, G.ground - G.wallTop);
  }

  function drawPile(){
    var lw = Math.max(1, 1.4 * W / 1000);
    for (var f = 0; f < fadingPile.length; f++){
      ctx.globalAlpha = fadingPile[f].a * 0.9;
      ctx.lineWidth = lw;
      ctx.strokeStyle = COLORS.muted;
      ctx.fillStyle = COLORS.paper;
      ctx.beginPath();
      ctx.arc(fadingPile[f].x, fadingPile[f].y, G.rPile, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.lineWidth = lw;
    ctx.strokeStyle = COLORS.muted;
    ctx.fillStyle = COLORS.paper;
    for (var i = 0; i < pile.length; i++){
      ctx.beginPath();
      ctx.arc(pile[i].x, pile[i].y, G.rPile, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  function drawParticles(){
    var s = W / 1000;
    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      var r = G.rIdea * Math.min(1, p.age * 5);
      var hot = p.counted;                       // cleared the hurdle
      var sneaky = p.mistake === "pass";         // cleared it by mistake
      var killed = p.mistake === "kill";         // rejected by mistake
      var lead = sneaky ? COLORS.red : (hot ? COLORS.green : COLORS.ink);

      if (p.trail.length > 1){
        for (var t = 1; t < p.trail.length; t++){
          var f = t / p.trail.length;
          ctx.strokeStyle = lead;
          ctx.globalAlpha = f * f * (hot || sneaky ? 0.7 : 0.35) * p.alpha;
          ctx.lineWidth = f * r * 1.5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(p.trail[t - 1].x, p.trail[t - 1].y);
          ctx.lineTo(p.trail[t].x, p.trail[t].y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = (hot || sneaky) ? lead : COLORS.paper;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = Math.max(1, 1.5 * s);
      ctx.strokeStyle = killed ? COLORS.red : lead;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function drawEffects(){
    var s = W / 1000;
    for (var i = 0; i < puffs.length; i++){
      var pf = puffs[i];
      ctx.globalAlpha = (1 - pf.t) * 0.6;
      ctx.strokeStyle = COLORS.muted;
      ctx.lineWidth = Math.max(1, 1.6 * s);
      ctx.beginPath();
      ctx.arc(pf.x, pf.y, G.rIdea * (1 + pf.t * 3.2), 0, Math.PI * 2);
      ctx.stroke();
    }
    for (var k = 0; k < sparks.length; k++){
      var sp = sparks[k];
      ctx.globalAlpha = 1 - sp.t;
      ctx.fillStyle = sp.red ? COLORS.red : COLORS.green;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, G.rIdea * 0.45 * (1 - sp.t), 0, Math.PI * 2);
      ctx.fill();
    }
    for (var m = 0; m < flashes.length; m++){
      var fl = flashes[m];
      ctx.globalAlpha = (1 - fl.t) * 0.9;
      ctx.strokeStyle = COLORS.red;
      ctx.lineWidth = Math.max(1.4, 2.2 * s);
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, G.rIdea * (1.2 + fl.t * 4.5), 0, Math.PI * 2);
      ctx.stroke();
    }
    for (var n = 0; n < xmarks.length; n++){
      var xm = xmarks[n];
      var xr = G.rIdea * 1.7 * (1 + xm.t * 0.4);
      ctx.globalAlpha = 1 - xm.t;
      ctx.strokeStyle = COLORS.red;
      ctx.lineWidth = Math.max(2, 3 * s);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(xm.x - xr, xm.y - xr);
      ctx.lineTo(xm.x + xr, xm.y + xr);
      ctx.moveTo(xm.x + xr, xm.y - xr);
      ctx.lineTo(xm.x - xr, xm.y + xr);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawHud(){
    var s = W / 1000;
    var st = STATES[stateIdx];

    ctx.globalAlpha = labelFade;
    text([st.name], 0.035 * W, 0.072 * H, 30 * s, { weight: 700 });
    text([st.sub], 0.035 * W, 0.072 * H + 37 * s, 24.5 * s,
         { color: COLORS.muted });
    ctx.globalAlpha = 1;

    // stats line, bottom: "N sampled · M cleared · R%" (omitted in the
    // reduced-motion vignette, where nothing is being counted)
    if (reduceMotion) return;
    var rate = sampled > 0 ? (100 * cleared / sampled).toFixed(1) : "0.0";
    var size = 24 * s;
    var x = 0.035 * W, y = 0.962 * H;
    var emphasize = stateIdx === 1; // lever 1: the count is the point
    var segs = [
      { t: sampled + " sampled", c: emphasize ? COLORS.ink : COLORS.muted,
        w: emphasize ? 700 : 400 },
      { t: "  ·  ", c: COLORS.muted, w: 400 },
      { t: cleared + " cleared", c: COLORS.muted, w: 400 },
      { t: "  ·  ", c: COLORS.muted, w: 400 },
      { t: rate + "%", c: COLORS.muted, w: 400 }
    ];
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    for (var i = 0; i < segs.length; i++){
      ctx.font = segs[i].w + " " + size + "px " + FONT;
      ctx.fillStyle = segs[i].c;
      ctx.fillText(segs[i].t, x, y);
      x += ctx.measureText(segs[i].t).width;
    }
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = COLORS.paper;
    ctx.fillRect(0, 0, W, H);
    drawBackdrop();
    drawPile();
    drawParticles();
    drawEffects();
    drawHud();
  }

  // ---------- reduced motion: static vignette ----------
  function buildVignette(){
    particles = []; pile = []; fadingPile = [];
    puffs = []; sparks = []; flashes = []; xmarks = [];
    for (var i = 0; i < 12 && i < slots.length; i++){
      pile.push({ x: slots[i].x, y: slots[i].y });
    }
    var meanPx = cur.mean * H, sigPx = cur.sig * H;
    var zs = [1.3, 0.7, 0.1, -0.5, -1.0];
    for (var j = 0; j < zs.length; j++){
      var yy = clamp(meanPx + zs[j] * sigPx, G.spawnMin, G.spawnMax);
      var xx = (0.30 + j * 0.092) * W;
      particles.push({
        x: xx, y: yy, baseY: yy, vx: 0, vy: 0,
        judged: true, pass: false, mistake: null, sneakTarget: null,
        resolved: false, counted: false, dying: false, state: "flying",
        slot: null, phase: 0, age: 1, alpha: 1,
        trail: [{ x: xx - 0.05 * W, y: yy }, { x: xx, y: yy }]
      });
    }
    var exY = G.wallTop - 0.018 * H;
    particles.push({
      x: 0.875 * W, y: exY, baseY: exY, vx: 0, vy: 0,
      judged: true, pass: true, mistake: null, sneakTarget: null,
      resolved: true, counted: true, dying: false, state: "flying",
      slot: null, phase: 0, age: 1, alpha: 1,
      trail: [{ x: 0.80 * W, y: exY }, { x: 0.875 * W, y: exY }]
    });
  }

  // ---------- main loop ----------
  var last = null;
  function frame(ts){
    if (!running) return;
    if (last === null) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function setRunning(on){
    if (reduceMotion) return;
    if (on === running) return;
    running = on;
    if (on){ last = null; requestAnimationFrame(frame); }
  }

  // ---------- deck protocol (K6) ----------
  window.addEventListener("message", function(e){
    var d = e && e.data;
    if (typeof d !== "string") return;
    if (d === "deck:pause"){ setRunning(false); return; }
    if (d === "deck:play"){ setRunning(true); return; }
    var m = /^lever:([0-4])$/.exec(d);
    if (m) setState(parseInt(m[1], 10));
  });

  // ---------- boot ----------
  resize();

  if (reduceMotion){
    running = false;
    buildVignette();
    draw();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
