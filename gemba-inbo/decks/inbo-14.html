<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>14 · Presentations & Wrap-Up — INBO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#111}
  :root{--paper:#FBFAF6;--ink:#17191F;--muted:#6C6F77;--faint:#9A9A93;--hair:#E6E2D8;--blue:#3F7E2A;--serif:'Newsreader',Georgia,serif;--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
  section{background:var(--paper);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;justify-content:center;padding:120px 130px}
  .eyebrow{font-family:var(--mono);font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .num{font-family:var(--mono);font-size:200px;font-weight:500;color:var(--blue);line-height:.9;letter-spacing:-.02em}
  h1{font-family:var(--serif);font-weight:500;font-size:96px;line-height:1.04;letter-spacing:-.015em;margin:0}
  .day{font-family:var(--mono);font-size:28px;color:var(--muted);margin-top:40px}
  .rule{width:120px;height:4px;background:var(--blue);margin:0 0 44px}
  .kicker{font-family:var(--mono);font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:36px}
  .draft h2{font-family:var(--serif);font-weight:500;font-size:72px;line-height:1.1;margin:0;max-width:20ch}
  .draft p{font-family:var(--sans);font-size:34px;line-height:1.55;color:var(--muted);margin:44px 0 0;max-width:34ch}
</style>
</head>
<body>
<deck-stage width="1920" height="1080">
  <section data-label="Title" data-speaker-notes="Session 14 — Presentations & Wrap-Up. Replace this placeholder deck with the built session slides.">
    <div class="eyebrow">GEMBA KMC · INBO · INSEAD</div>
    <div class="num" style="margin:40px 0 48px">14</div>
    <h1>Presentations & Wrap-Up</h1>
    <div class="day">Friday · 23 Oct 2026</div>
  </section>
  <section data-label="In preparation" data-speaker-notes="Placeholder slide.">
    <div class="rule"></div>
    <div class="draft">
      <div class="kicker">Session 14</div>
      <h2>Slides in preparation</h2>
      <p>This deck is a placeholder. Replace it with the built session slides — the course page links here automatically once released.</p>
    </div>
  </section>
</deck-stage>
<script src="deck-stage.js"></script>
</body>
</html>
