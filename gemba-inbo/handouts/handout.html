<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INBO handout</title>
<!--
  2-slides-per-page handout generator.
    handouts/handout.html?deck=inbo-08            preview
    handouts/handout.html?deck=inbo-08&notes=1    add ruled note lines under each slide
    handouts/handout.html?deck=inbo-08&paper=letter
  Fully automatic PDF:  run handouts/make-handout.ps1 (Windows) or make-handout.sh (Mac/Linux).
  By hand: Print -> Save as PDF -> margins None -> Background graphics on.
-->
<style>
  @page { size: A4 portrait; margin: 0; }
  *{box-sizing:border-box}
  html,body{margin:0;background:#e9e9e6;font-family:system-ui,sans-serif;color:#131312}
  #bar{position:sticky;top:0;z-index:5;background:#131312;color:#fff;padding:10px 18px;font-size:14px;display:flex;gap:16px;align-items:center}
  #bar button{font:inherit;padding:6px 14px;border:0;border-radius:6px;background:#fff;color:#131312;cursor:pointer}
  #bar span{opacity:.8}
  .page{width:210mm;height:297mm;margin:12px auto;background:#fff;padding:14mm 15mm 10mm;display:flex;flex-direction:column;justify-content:space-between;break-after:page;page-break-after:always;overflow:hidden;position:relative}
  body.letter .page{width:8.5in;height:11in}
  .slot{width:180mm}
  .frame{width:180mm;height:101.25mm;position:relative;overflow:hidden;border:.3mm solid #cfcfc8;background:#fff}
  .frame > .hs{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
  .cap{font:8pt/1.2 ui-monospace,Consolas,monospace;color:#71716A;margin:1.5mm 0 0;display:flex;justify-content:space-between}
  .lines{margin-top:2mm}
  .lines i{display:block;border-bottom:.25mm solid #cfcfc8;height:6.5mm}
  .hdr{position:absolute;top:6mm;left:15mm;right:15mm;font:8pt ui-monospace,Consolas,monospace;color:#71716A;display:flex;justify-content:space-between}
  @media print{
    html,body{background:#fff !important}
    #bar{display:none}
    .page{margin:0}
  }
  /* every slide shown fully revealed, at the end of its animations */
  .hs [data-reveal]{opacity:1 !important;visibility:visible !important;transition:none !important}
  .hs *,.hs *::before,.hs *::after{animation-delay:-99s !important;animation-duration:.001s !important;animation-iteration-count:1 !important;animation-fill-mode:both !important;transition-duration:0s !important}
  .hs{opacity:1 !important;visibility:visible !important}
  .hs button{display:none !important}
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
</style>
</head>
<body>
<div id="bar"><button onclick="window.print()">Print / Save as PDF</button><span id="status">Loading…</span></div>
<div id="out"></div>
<script>
(async function(){
  const q = new URLSearchParams(location.search);
  const deck = (q.get('deck') || 'inbo-08').replace(/[^a-z0-9-]/gi,'');
  const notes = q.get('notes') === '1';
  const letter = q.get('paper') === 'letter';
  if(letter){ document.body.classList.add('letter'); const p=document.createElement('style'); p.textContent='@page{size:Letter portrait;margin:0}'; document.head.appendChild(p); }
  const st = document.getElementById('status');
  const isUrl = v => /^(data:|https?:|\/\/|#|blob:)/i.test(v);
  try{
    const base = new URL('../decks/', location.href).href;
    const html = await (await fetch(base + deck + '.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    document.title = (doc.title || deck) + ' — handout';

    // fonts + styles from the deck (relative urls made absolute)
    const fixCssUrls = css => css.replace(/url\((['"]?)(?!data:|https?:|\/\/|#)([^)'"]+)\1\)/g,(m,qt,u)=>'url('+new URL(u,base).href+')');
    doc.querySelectorAll('link[rel=stylesheet]').forEach(l=>{
      const n = document.createElement('link'); n.rel='stylesheet'; n.href = new URL(l.getAttribute('href'), base).href; document.head.appendChild(n);
    });
    doc.querySelectorAll('style').forEach(s=>{
      const n = document.createElement('style'); n.textContent = fixCssUrls(s.textContent); document.head.appendChild(n);
    });
    const fix = document.createElement('style');
    fix.textContent='html,body{margin:0 !important;height:auto !important;overflow:visible !important}body{background:#e9e9e6 !important}@media print{body{background:#fff !important}}';
    document.head.appendChild(fix);

    const secs = Array.from(doc.querySelectorAll('deck-stage > section')).filter(s=>!s.hasAttribute('data-deck-skip'));
    const out = document.getElementById('out');
    const scale = (180 / 25.4 * 96) / 1920;                  // 180 mm frame width in CSS px
    const title = (doc.title || deck).replace(/\s+—\s+INBO$/,'');
    const total = secs.length;

    for(let i=0;i<total;i+=2){
      const page = document.createElement('div'); page.className='page';
      page.innerHTML = '<div class="hdr"><span>INBO · '+title+'</span><span>INSEAD GEMBA</span></div><div style="height:4mm"></div>';
      const col = document.createElement('div'); col.style.cssText='display:flex;flex-direction:column;justify-content:space-around;flex:1';
      for(let j=i;j<Math.min(i+2,total);j++){
        const slot = document.createElement('div'); slot.className='slot';
        const frame = document.createElement('div'); frame.className='frame';
        const wrap = document.createElement('div'); wrap.className='hs'; wrap.style.transform='scale('+scale+')';
        // importNode (not cloneNode) so the nodes belong to THIS document and images actually load
        const s = document.importNode(secs[j], true);
        s.setAttribute('data-deck-active','');
        s.style.cssText += ';position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:1;visibility:visible;transform:none';
        s.querySelectorAll('script,video,audio,iframe,canvas').forEach(el=>el.remove());
        s.querySelectorAll('[style*="url("]').forEach(el=>el.setAttribute('style', fixCssUrls(el.getAttribute('style'))));
        s.querySelectorAll('img').forEach(img=>{
          const v = img.getAttribute('src');
          img.removeAttribute('loading'); img.loading='eager'; img.decoding='sync';
          if(v && !isUrl(v)) img.src = new URL(v, base).href; else if(v){ img.src = v; }
        });
        s.querySelectorAll('image[href],use[href]').forEach(el=>{ const v=el.getAttribute('href'); if(v && !isUrl(v)) el.setAttribute('href', new URL(v,base).href); });
        wrap.appendChild(s); frame.appendChild(wrap); slot.appendChild(frame);
        const cap = document.createElement('div'); cap.className='cap';
        cap.innerHTML='<span>'+(secs[j].getAttribute('data-label')||'')+'</span><span>'+(j+1)+' / '+total+'</span>';
        slot.appendChild(cap);
        if(notes){ const l=document.createElement('div'); l.className='lines'; l.innerHTML='<i></i><i></i><i></i>'; slot.appendChild(l); }
        col.appendChild(slot);
      }
      page.appendChild(col);
      out.appendChild(page);
    }

    // wait for every image, web font and stylesheet before declaring the page ready
    const imgs = Array.from(out.querySelectorAll('img'));
    let done = 0; const upd = () => st.textContent = 'Loading images ' + done + ' / ' + imgs.length + '…';
    upd();
    await Promise.all(imgs.map(img => new Promise(res=>{
      const fin = () => { done++; upd(); res(); };
      if(img.complete && img.naturalWidth) return fin();
      img.addEventListener('load', fin, {once:true});
      img.addEventListener('error', () => { console.warn('image failed', img.src); fin(); }, {once:true});
    })));
    try{ await Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,4000))]); }catch(e){}
    const failed = imgs.filter(i=>!i.naturalWidth).length;
    st.textContent = total + ' slides · ' + Math.ceil(total/2) + ' pages · ' + imgs.length + ' images' + (failed? ' ('+failed+' failed to load)':'') + ' — Print → Save as PDF (margins None, Background graphics on)';
    document.documentElement.setAttribute('data-ready','1');
    if(q.get('auto') === '1') setTimeout(()=>window.print(), 300);
  }catch(e){ st.textContent = 'Could not load deck: ' + e.message + ' (open via http(s), or use the make-handout script)'; }
})();
</script>
</body>
</html>
