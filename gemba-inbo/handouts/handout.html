<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INBO handout</title>
<!--
  INBO: A4 handout, exactly two slides per page (top and bottom), each as wide as the margins allow.
    handouts/handout.html?deck=inbo-08            preview
    handouts/handout.html?deck=inbo-08&notes=1    add ruled note lines under each slide
  Fully automatic PDF:  run handouts/make-handout.ps1 (Windows) or make-handout.sh (Mac/Linux).
  By hand: Print -> Save as PDF -> A4, margins None, Background graphics on.
  Source notes (.pnote) and other print-only extras from the decks are NOT shown.
  NOTE: every class used by this page is prefixed "h-" so it can never collide with a deck's own
  classes (decks use .frame, .cap, .page ... inside their slides).
-->
<style>
  @page { size: 210mm 297mm; margin: 0; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#e9e9e6;font-family:system-ui,sans-serif;color:#131312}
  #h-bar{position:sticky;top:0;z-index:5;background:#131312;color:#fff;padding:10px 18px;font-size:14px;display:flex;gap:16px;align-items:center}
  #h-bar button{font:inherit;padding:6px 14px;border:0;border-radius:6px;background:#fff;color:#131312;cursor:pointer}
  #h-bar span{opacity:.8}

  /* one sheet = one A4 page; absolute positions, 1 mm of slack so it never spills onto a 2nd page.
     Slides are 190 mm wide (10 mm side margins), 16:9 => 106.9 mm tall. */
  .h-page{position:relative;display:block;width:210mm;height:296mm;margin:12px auto;background:#fff;overflow:hidden;
          break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid}
  .h-page:last-child{break-after:auto;page-break-after:auto}
  .h-slot{position:absolute;left:10mm;width:190mm}
  .h-slot.a{top:20mm}
  .h-slot.b{top:166mm}
  body.h-withnotes .h-slot.a{top:17mm}
  body.h-withnotes .h-slot.b{top:152mm}
  .h-frame{width:190mm;height:106.875mm;position:relative;overflow:hidden;border:.3mm solid #cfcfc8;background:#fff}
  .h-frame > .h-scale{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
  .h-cap{font:8pt/1.2 ui-monospace,Consolas,monospace;color:#71716A;margin:1.5mm 0 0;display:flex;justify-content:space-between}
  .h-lines{margin-top:2mm}
  .h-lines i{display:block;border-bottom:.25mm solid #cfcfc8;height:6.5mm}
  .h-hdr{position:absolute;top:9mm;left:10mm;right:10mm;font:8pt ui-monospace,Consolas,monospace;color:#71716A;display:flex;justify-content:space-between}
  @media print{
    html,body{background:#fff !important;margin:0 !important;padding:0 !important}
    #h-bar{display:none !important}
    .h-page{margin:0 !important}
  }
  /* every slide shown fully revealed, at the end of its animations */
  .h-scale [data-reveal]{opacity:1 !important;visibility:visible !important;transition:none !important}
  /* no animations at all: elements simply sit in their final, natural state (more reliable in PDF than fast-forwarding) */
  .h-scale *,.h-scale *::before,.h-scale *::after{animation:none !important;transition:none !important;will-change:auto !important}
  .h-scale{opacity:1 !important;visibility:visible !important}
  .h-scale button{display:none !important}
  /* no source/credit notes, speaker notes or other print-only extras inside the slide images */
  .h-scale .pnote,.h-scale [data-speaker-notes],.h-scale aside,.h-scale .notes,.h-scale .speaker-notes{display:none !important}
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
</style>
</head>
<body>
<div id="h-bar"><button onclick="window.print()">Print / Save as PDF</button><span id="h-status">Loading…</span></div>
<div id="h-out"></div>
<script>
(async function(){
  const q = new URLSearchParams(location.search);
  const deck = (q.get('deck') || 'inbo-08').replace(/[^a-z0-9-]/gi,'');
  const notes = q.get('notes') === '1';
  if(notes) document.body.classList.add('h-withnotes');
  const st = document.getElementById('h-status');
  const isUrl = v => /^(data:|https?:|\/\/|#|blob:)/i.test(v);
  try{
    const base = new URL('../decks/', location.href).href;
    const html = await (await fetch(base + deck + '.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    document.title = (doc.title || deck) + ' — handout';

    // fonts + styles from the deck (relative urls made absolute)
    const fixCssUrls = css => css.replace(/url\((['"]?)(?!data:|https?:|\/\/|#)([^)'"]+)\1\)/g,(m,qt,u)=>'url('+new URL(u,base).href+')');
    doc.querySelectorAll('link[rel=stylesheet]').forEach(l=>{
      const n = document.createElement('link'); n.rel='stylesheet'; n.href = new URL(l.getAttribute('href'), base).href; document.head.appendChild(n);
    });
    doc.querySelectorAll('style').forEach(s=>{
      // drop any @page rule from the deck so ours (A4) always wins
      const css = fixCssUrls(s.textContent).replace(/@page\s*[^{]*\{[^}]*\}/g,'');
      const n = document.createElement('style'); n.textContent = css; document.head.appendChild(n);
    });
    // our page-level rules go LAST so they override the deck's
    const fix = document.createElement('style');
    fix.textContent='@page{size:210mm 297mm;margin:0}html,body{margin:0 !important;padding:0 !important;height:auto !important;overflow:visible !important}body{background:#e9e9e6 !important}@media print{body{background:#fff !important}}';
    document.head.appendChild(fix);

    const secs = Array.from(doc.querySelectorAll('deck-stage > section')).filter(s=>!s.hasAttribute('data-deck-skip'));
    const out = document.getElementById('h-out');
    const scale = (190 / 25.4 * 96) / 1920;                  // 190 mm frame width in CSS px
    const title = (doc.title || deck).replace(/\s+—\s+INBO$/,'');
    const total = secs.length;

    for(let i=0;i<total;i+=2){
      const page = document.createElement('div'); page.className='h-page';
      page.innerHTML = '<div class="h-hdr"><span>INBO · '+title+'</span><span>INSEAD GEMBA</span></div>';
      for(let j=i;j<Math.min(i+2,total);j++){
        const slot = document.createElement('div'); slot.className='h-slot ' + (j===i ? 'a' : 'b');
        const frame = document.createElement('div'); frame.className='h-frame';
        const wrap = document.createElement('div'); wrap.className='h-scale'; wrap.style.zoom = scale;   // zoom (not transform): the layout box shrinks too, so the printer never fragments it across pages
        // importNode (not cloneNode) so the nodes belong to THIS document and images actually load
        const s = document.importNode(secs[j], true);
        s.setAttribute('data-deck-active','');
        s.style.cssText += ';position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:1;visibility:visible;transform:none';
        s.querySelectorAll('script,video,audio,iframe,canvas,.pnote,aside,[data-speaker-notes]').forEach(el=>el.remove());
        s.removeAttribute('data-speaker-notes');
        s.querySelectorAll('[style*="url("]').forEach(el=>el.setAttribute('style', fixCssUrls(el.getAttribute('style'))));
        s.querySelectorAll('img').forEach(img=>{
          const v = img.getAttribute('src');
          img.removeAttribute('loading'); img.loading='eager'; img.decoding='sync';
          if(v && !isUrl(v)) img.src = new URL(v, base).href; else if(v){ img.src = v; }
        });
        s.querySelectorAll('image[href],use[href]').forEach(el=>{ const v=el.getAttribute('href'); if(v && !isUrl(v)) el.setAttribute('href', new URL(v,base).href); });
        wrap.appendChild(s); frame.appendChild(wrap); slot.appendChild(frame);
        const cap = document.createElement('div'); cap.className='h-cap';
        cap.innerHTML='<span>'+(secs[j].getAttribute('data-label')||'')+'</span><span>'+(j+1)+' / '+total+'</span>';
        slot.appendChild(cap);
        if(notes){ const l=document.createElement('div'); l.className='h-lines'; l.innerHTML='<i></i><i></i><i></i>'; slot.appendChild(l); }
        page.appendChild(slot);
      }
      out.appendChild(page);
    }

    // wait for every image, web font and stylesheet before declaring the page ready
    const imgs = Array.from(out.querySelectorAll('img'));
    let done = 0; const upd = () => st.textContent = 'Loading images ' + done + ' / ' + imgs.length + '…';
    upd();
    await Promise.all(imgs.map(img => new Promise(res=>{
      const fin = () => { done++; upd(); res(); };
      if(img.complete && img.naturalWidth) return fin();
      img.addEventListener('load', fin, {once:true});
      img.addEventListener('error', () => { console.warn('image failed', img.src); fin(); }, {once:true});
      setTimeout(fin, 20000);
    })));
    try{ await Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,4000))]); }catch(e){}
    const failed = imgs.filter(i=>!i.naturalWidth).length;
    st.textContent = total + ' slides · ' + Math.ceil(total/2) + ' A4 pages · ' + imgs.length + ' images' + (failed? ' ('+failed+' failed to load)':'') + ' — Print → Save as PDF (A4, margins None, Background graphics on)';
    document.documentElement.setAttribute('data-ready','1');
    if(q.get('auto') === '1') setTimeout(()=>window.print(), 300);
  }catch(e){ st.textContent = 'Could not load deck: ' + e.message + ' (open via http(s), or use the make-handout script)'; }
})();
</script>
</body>
</html>
