function redraw(){ctx.clearRect(0,0,cv.width,cv.height);(annotations[i]||[]).forEach(drawStroke);if(drawing&&cur)drawStroke(cur);}
function near(s,P){const r=cv.getBoundingClientRect(),rad=SIZE.eraser;for(const q of s.points){const dx=(q.x-P.x)*r.width,dy=(q.y-P.y)*r.height;if(Math.hypot(dx,dy)<rad)return true;}return false;}
function eraseAt(e){const P=pt(e),arr=annotations[i]||[];const keep=arr.filter(s=>!near(s,P));if(keep.length!==arr.length){annotations[i]=keep;redraw();}}
cv.addEventListener('pointerdown',e=>{if(!document.body.classList.contains('draw'))return;if(e.pointerType==='touch')return;e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;if(tool==='eraser'){eraseAt(e);return;}cur={tool,color:(tool==='hi'?hiColor:penColor),size:SIZE[tool],points:[pt(e)]};redraw();});
cv.addEventListener('pointermove',e=>{if(!drawing)return;if(e.pointerType==='touch')return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];if(tool==='eraser'){evs.forEach(eraseAt);return;}evs.forEach(ev=>cur.points.push(pt(ev)));redraw();});
function endStroke(){if(!drawing)return;drawing=false;if(tool!=='eraser'&&cur&&cur.points.length){(annotations[i]=annotations[i]||[]).push(cur);}cur=null;redraw();}
cv.addEventListener('pointerup',endStroke);cv.addEventListener('pointercancel',endStroke);cv.addEventListener('pointerleave',()=>{if(drawing&&tool!=='eraser')endStroke();});
function setTool(t){tool=t;document.getElementById('tPen').classList.toggle('on',t==='pen');document.getElementById('tHi').classList.toggle('on',t==='hi');document.getElementById('tErase').classList.toggle('on',t==='eraser');markSwatches();}
function markSwatches(){const c=(tool==='hi')?hiColor:penColor;document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.c.toLowerCase()===c.toLowerCase()));}
function setDraw(on){document.body.classList.toggle('draw',on);document.getElementById('tDraw').classList.toggle('on',document.body.classList.contains('draw'));}
document.getElementById('tDraw').onclick=()=>setDraw(!document.body.classList.contains('draw'));
document.getElementById('tPen').onclick=()=>{setDraw(true);setTool('pen');};
document.getElementById('tHi').onclick=()=>{setDraw(true);setTool('hi');};
document.getElementById('tErase').onclick=()=>{setDraw(true);setTool('eraser');};
document.getElementById('tUndo').onclick=()=>{const a=annotations[i];if(a&&a.length){a.pop();redraw();}};
document.getElementById('tClear').onclick=()=>{annotations[i]=[];redraw();};
document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{if(tool==='eraser')setTool('pen');if(tool==='hi')hiColor=s.dataset.c;else penColor=s.dataset.c;markSwatches();});
document.getElementById('railtoggle').onclick=()=>document.body.classList.toggle('no-rail');
function fmt(s){if(s==null)return'?';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function ytId(u){const m=u.match(/[?&]v=([^&]+)/)||u.match(/youtu\.be\/([^?&]+)/)||u.match(/embed\/([^?&]+)/);return m?m[1]:null;}
function playLocal(vc){const m=document.createElement('div');m.className='ytmodal';const inner=document.createElement('div');inner.className='ytinner';
  const v=document.createElement('video');v.controls=true;v.playsInline=true;v.autoplay=true;v.preload='metadata';v.style.cssText='position:absolute;inset:0;width:100%;height:100%;background:#000';
  let src=vc.local;if(vc.ls!=null||vc.le!=null)src+='#t='+(vc.ls||0)+(vc.le!=null?','+vc.le:'');v.src=src;
  v.addEventListener('loadedmetadata',()=>{if(vc.ls!=null){try{v.currentTime=vc.ls;}catch(e){}}});
  v.addEventListener('timeupdate',()=>{if(vc.le!=null&&v.currentTime>=vc.le)v.pause();});
  const cl=document.createElement('button');cl.className='ytclose';cl.innerHTML='✕';cl.onclick=()=>{v.pause();m.remove();};
  inner.appendChild(v);inner.appendChild(cl);m.appendChild(inner);m.addEventListener('click',e=>{if(e.target===m){v.pause();m.remove();}});
  document.addEventListener('keydown',function esc(ev){if(ev.key==='Escape'){v.pause();m.remove();document.removeEventListener('keydown',esc);}});
  document.body.appendChild(m);}
function playOnline(url,os,oe){const id=ytId(url);
  if(id){const m=document.createElement('div');m.className='ytmodal';const inner=document.createElement('div');inner.className='ytinner';
    const fr=document.createElement('iframe');let s='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';if(os!=null)s+='&start='+Math.floor(os);if(oe!=null)s+='&end='+Math.ceil(oe);
    fr.src=s;fr.allow='autoplay; encrypted-media; fullscreen';fr.setAttribute('allowfullscreen','');
    const cl=document.createElement('button');cl.className='ytclose';cl.innerHTML='✕';cl.onclick=()=>m.remove();
    inner.appendChild(fr);inner.appendChild(cl);m.appendChild(inner);m.addEventListener('click',e=>{if(e.target===m)m.remove();});
    document.addEventListener('keydown',function esc(ev){if(ev.key==='Escape'){m.remove();document.removeEventListener('keydown',esc);}});
    document.body.appendChild(m);}
  else{window.open(url,'_blank','noopener');}}
function render(){const d=DATA[i];
  document.querySelectorAll('.ytmodal').forEach(n=>n.remove());
  [...box.querySelectorAll('video,.voverlay')].forEach(n=>n.remove());
  simg.style.display='';simg.src=d.img;simg.alt='Slide '+(i+1);
  simg.classList.remove('anim');void simg.offsetWidth;simg.classList.add('anim');
  if(d.video){const vc=d.video;const ov=document.createElement('div');ov.className='voverlay';
    const bl=document.createElement('button');bl.className='vbtn';bl.innerHTML='▶ Play offline';bl.onclick=()=>playLocal(vc);ov.appendChild(bl);
    if(vc.online){const bo=document.createElement('button');bo.className='vbtn online';bo.innerHTML='▶ Play online ↗';bo.onclick=()=>playOnline(vc.online,vc.os,vc.oe);ov.appendChild(bo);}
    const parts=[];if(vc.ls!=null||vc.le!=null)parts.push('offline '+fmt(vc.ls||0)+'–'+fmt(vc.le));if(vc.os!=null||vc.oe!=null)parts.push('online '+fmt(vc.os||0)+'–'+fmt(vc.oe));
    if(parts.length){const tr=document.createElement('span');tr.className='vtrim';tr.textContent=parts.join('   ·   ');ov.appendChild(tr);}
    box.appendChild(ov);}
  document.getElementById('cur').textContent=i+1;
  document.getElementById('prev').disabled=(i===0);document.getElementById('next').disabled=(i===DATA.length-1);
  linksEl.innerHTML='';
  if(d.links&&d.links.length){const l=document.createElement('span');l.className='lbl';l.textContent='Links on this slide';linksEl.appendChild(l);
    d.links.forEach(k=>{const a=document.createElement('a');a.className='chip';a.href=k.u;a.target='_blank';a.rel='noopener';a.textContent=k.t;linksEl.appendChild(a);});}
  redraw();syncRail();}
function go(n){const j=Math.min(Math.max(n,0),DATA.length-1);if(j!==i){i=j;render();}}
document.getElementById('prev').onclick=()=>go(i-1);document.getElementById('next').onclick=()=>go(i+1);
document.addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'){e.preventDefault();go(i+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(i-1);}
  else if(k===' '){if(!document.body.classList.contains('draw')){e.preventDefault();go(i+1);}}
  else if(k==='Home')go(0);else if(k==='End')go(DATA.length-1);
  else if(k==='a'||k==='A')setDraw(!document.body.classList.contains('draw'));
  else if(k==='p'||k==='P'){setDraw(true);setTool('pen');}
  else if(k==='h'||k==='H'){setDraw(true);setTool('hi');}
  else if(k==='e'||k==='E'){setDraw(true);setTool('eraser');}
  else if(k==='u'||k==='U'){const a=annotations[i];if(a&&a.length){a.pop();redraw();}}
  else if(k==='t'||k==='T')document.body.classList.toggle('no-rail');
  else if(k==='b'||k==='B')document.body.classList.toggle('black');
  else if(k==='f'||k==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen();}});
new ResizeObserver(fitCanvas).observe(box);
function start(){buildRail();fitCanvas();setTool('pen');render();}
if(EDIT){applySavedOrder();start();}
else{fetch('slide-deck.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(o=>{applyDeck(o);}).catch(()=>{}).finally(start);}
</script></body></html>
