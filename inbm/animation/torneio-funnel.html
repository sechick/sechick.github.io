<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneio — Innovation Tournament Funnel</title>
<style>
  :root{
    --bg:#eef3f6;
    --card:#fdfefe;
    --ink:#1f2937;
    --muted:#64748b;
    --line:#dde5ea;
    --accent:#f08c1e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--card);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink);
  }
  .wrap{width:100%;height:100%}
  .stage{
    position:relative;width:100%;height:100%;
    background:var(--card);
    overflow:hidden;
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* control bar hides behind hover: no sub-floor chrome text while presenting */
  .controls{
    position:fixed;left:16px;right:16px;bottom:12px;
    display:flex;align-items:center;gap:10px;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  body:hover .controls{opacity:1;pointer-events:auto}
  button{
    font:600 20px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--muted);
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:10px 18px;cursor:pointer;
    transition:color .15s,border-color .15s,transform .05s;
  }
  button:hover{color:var(--ink);border-color:#b9c6cf}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .stats{
    margin-left:auto;
    font:500 20px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--muted);letter-spacing:.02em;white-space:nowrap;
    transition:color .2s;
    background:rgba(253,254,254,.9);border-radius:8px;padding:6px 10px;
  }
  .stats.flash{color:var(--accent)}
  @media (max-width:560px){
    .controls{flex-wrap:wrap}
    .stats{width:100%;margin-left:0;margin-top:4px}
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="stage"><canvas id="c" aria-label="Animated innovation tournament: about 200 ideas generated individually pass through the torneio platform leaving about 40 sixty-second pitches, then 10 teams of 4 form around the top ideas and refine their theses, then all ten pass the multivote and three or four are planted as ventures that grow in the final pitches on Friday."></canvas></div>
  <div class="controls">
    <button id="playBtn" type="button">Pause</button>
    <button id="speedBtn" type="button">Speed 1&times;</button>
    <button id="replayBtn" type="button">Replay</button>
    <div class="stats" id="stats"></div>
  </div>
</main>

    treeG = 0; celebrated = false;
    for (var tr = 0; tr < G.trees.length; tr++){ G.trees[tr].g = 0; G.trees[tr].planted = false; G.trees[tr].celebrated = false; }
    arrived = [N, 0, 0, 0]; exited = 0;
    var order = [];
    for (var i = 0; i < N; i++) order.push(i);
    for (i = N-1; i > 0; i--){
      var j = Math.floor(rng()*(i+1));
      var t = order[i]; order[i] = order[j]; order[j] = t;
    }
    var rects = [G.r0, G.r1, G.r2, G.r3];
    for (i = 0; i < N; i++){
      var rank = order[i]; // rank < KEEP[k] means it survives gate k
      var lastStage = rank < KEEP[3] ? 3 : rank < KEEP[2] ? 2 :
                      rank < KEEP[1] ? 1 : 0;
      var homes = [];
      for (var k = 0; k <= Math.min(lastStage+1, 3); k++)
        homes.push(placeIn(rects[Math.min(k, lastStage)]));
      // homes[k] valid for k<=lastStage; recompute properly:
      homes = [];
      for (k = 0; k <= lastStage; k++) homes.push(placeIn(rects[k]));
      dots.push({
        homes: homes,
        lastStage: lastStage,           // region it ultimately reaches
        delay: [0,0,0],                 // per-wave departure delays
        phase: rng()*6.28,
        sparked: [false,false,false], counted: false,
        isExit: false, exitP: 0, treeIdx: -1
      });
    }
    // stagger departures per wave
    for (i = 0; i < N; i++){
      dots[i].delay[0] = rng()*2.6;
      dots[i].delay[1] = rng()*1.8;
      dots[i].delay[2] = rng()*1.4;
    }
    // of the ten refined theses, plant 3-4 as the final-pitch ventures
    var finalists = [];
    for (i = 0; i < N; i++) if (dots[i].lastStage === 3) finalists.push(i);
    for (i = finalists.length-1; i > 0; i--){
      var fj = Math.floor(rng()*(i+1));
      var ftmp = finalists[i]; finalists[i] = finalists[fj]; finalists[fj] = ftmp;
    }
    var K = Math.min(G.trees.length, finalists.length);
    for (i = 0; i < K; i++){ dots[finalists[i]].isExit = true; dots[finalists[i]].treeIdx = i; }
  }

  // ---------- timeline ----------
  // phases: 0 mill | 1 wave1 | 2 pause | 3 wave2 | 4 pause | 5 wave3
  //         6 pause | 7 exit flight | 8 hold | 9 fade out -> restart
  var DUR = [1.8, 4.6, 0.9, 3.8, 0.9, 3.4, 1.0, 3.0, 2.8, 0.9];
  var TOTAL = DUR.reduce(function(a,b){return a+b;},0);
  var T = 0, time = 0, globalAlpha = 1, runCount = 0;

  function phaseInfo(){
    var t = T, p = 0;
    while (p < DUR.length && t >= DUR[p]){ t -= DUR[p]; p++; }
    return { p: p, t: t };
  }

  function easeInOut(u){ return u*u*(3-2*u); }
  function easeOut(u){ return 1-(1-u)*(1-u); }

  var TRAVEL = 1.7; // seconds a dot spends crossing between regions

  // position of a dot during wave w (moving from region w to w+1 or dying)
  function wavePos(d, w, t){
    var p = Math.min(1, Math.max(0, (t - d.delay[w]) / TRAVEL));
    var from = d.homes[w];
    var dies = d.lastStage === w;
    var gate = G.gates[w];
    var crossY = dies ? from.y
               : from.y + (d.homes[w+1].y - from.y) * 0.55;
    crossY = Math.max(gate.y0+8, Math.min(gate.y1-8, crossY));
    var cross = { x: gate.x - (dies ? G.radii[w]+gate.w*0 : 0), y: crossY };
    if (dies){
      var q = easeOut(p);
      return { x: from.x + (cross.x-from.x)*q,
               y: from.y + (cross.y-from.y)*q,
               p: p, dies: true };
    }
    var u = easeInOut(p);
    var to = d.homes[w+1];
    if (u < 0.55){
      var q1 = u/0.55;
      return { x: from.x + (cross.x+gate.w*1.6-from.x)*q1,
               y: from.y + (cross.y-from.y)*q1, p: p, dies: false, u: u };
    }
    var q2 = (u-0.55)/0.45;
    return { x: cross.x+gate.w*1.6 + (to.x-(cross.x+gate.w*1.6))*q2,
             y: cross.y + (to.y-cross.y)*q2, p: p, dies: false, u: u };
  }

  function dotState(d){
    // returns {x, y, stage, alpha, moving} for current T
    var ph = phaseInfo(), p = ph.p, t = ph.t;
    var wave = p === 1 ? 0 : p === 3 ? 1 : p === 5 ? 2 : -1;
    var settledStage =
      p <= 1 ? 0 : p <= 3 ? 1 : p <= 5 ? 2 : 3;
    var DIM = 0.32; // failures remain visible as the funnel's residue

    if (wave >= 0 && d.lastStage > wave){
      // a survivor of this gate: fly through it
      var wp = wavePos(d, wave, t);
      if (!d.sparked[wave] && wp.u !== undefined && wp.u >= 0.55){
        d.sparked[wave] = true;
        sparks.push({ x: G.gates[wave].x + G.gates[wave].w/2, y: wp.y,
                      t: 0, color: G.gates[wave].color });
        arrived[wave+1]++;
      }
      var st = wave + (wp.u !== undefined && wp.u >= 0.55 ? 1 : 0);
      return { x: wp.x, y: wp.y, stage: Math.min(st, 3),
               alpha: 1, moving: wp.p > 0 && wp.p < 1 };
    }

    // settled (either waiting, or left behind at an earlier gate)
    var stage = Math.min(settledStage, d.lastStage);
    var leftBehind = d.lastStage < settledStage ||
                     (wave >= 0 && d.lastStage === wave);
    var alpha = 1;
    if (leftBehind){
      if (wave >= 0 && d.lastStage === wave){
        alpha = 1 - (1-DIM)*Math.min(1, t/DUR[p]); // dim as the wave passes
      } else {
        alpha = DIM;
      }
    }
    var h = d.homes[stage];
    var wig = 0.0022*W * (leftBehind ? 0.5 : 1);
    var x = h.x + Math.sin(time*1.3 + d.phase)*wig;
    var y = h.y + Math.cos(time*1.1 + d.phase*1.7)*wig;
    // exit flight for the chosen one
    if (d.isExit && p >= 7){
      var tr = G.trees[d.treeIdx];
      var et = p === 7 ? Math.min(1, (t - d.treeIdx*0.18)/2.4) : 1;
      et = Math.max(0, et);
      var u = easeInOut(et);
      var sx = h.x, sy = h.y;
      var tx = tr.x, ty = tr.baseY - 0.012*H;
      var cx = (sx+tx)/2, cy = Math.min(sy,ty) - 0.16*H; // arc over
      var ix = (1-u)*(1-u)*sx + 2*(1-u)*u*cx + u*u*tx;
      var iy = (1-u)*(1-u)*sy + 2*(1-u)*u*cy + u*u*ty;
      if (et >= 1 && !d.counted){ d.counted = true; tr.planted = true; } // the thesis takes root
      return { x: ix, y: iy, stage: 3, alpha: et >= 1 ? 0 : 1,
               moving: true, gold: true };
    }
    return { x: x, y: y, stage: stage, alpha: alpha, moving: false };
  }

  function celebrate(tr){
    flashStats();
    for (var i = 0; i < 8; i++){
      bills.push({
        x: tr.x + (rng()-0.5)*tr.R*2.0,
        y: tr.canopyY + (rng()-0.5)*tr.R*1.2,
        vy: (0.05+rng()*0.06)*H,
        sway: rng()*6.28,
        rot: (rng()-0.5)*1.2,
        t: 0
      });
    }
    for (i = 0; i < 7; i++){
      var a = rng()*6.28, s = (0.02+rng()*0.05)*W;
      sparks.push({ x: tr.x, y: tr.canopyY,
                    vx: Math.cos(a)*s, vy: Math.sin(a)*s,
                    t: 0, color: COLORS.goldHi });
    }
  }

  var flashTimer = null;
  function flashStats(){
    statsEl.classList.add("flash");
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){ statsEl.classList.remove("flash"); }, 800);
  }

  // ---------- update ----------
  function update(dt){
    time += dt;
    T += dt;
    var ph = phaseInfo();
    globalAlpha = ph.p === 9 ? 1 - ph.t/DUR[9] : 1;
    for (var tg = 0; tg < G.trees.length; tg++){
      var trg = G.trees[tg];
      if (trg.planted && trg.g < 1){
        trg.g = Math.min(1, trg.g + dt/1.5);
        if (trg.g > 0.85 && !trg.celebrated){ trg.celebrated = true; celebrate(trg); }
      }
    }
    if (T >= TOTAL){
      runCount++;
      buildCohort(1234 + runCount*7919);
      T = 0; globalAlpha = 1;
    }
    for (var j = puffs.length-1; j >= 0; j--){
      puffs[j].t += dt*2.4;
      if (puffs[j].t >= 1) puffs.splice(j,1);
    }
    for (var k = sparks.length-1; k >= 0; k--){
      var sp = sparks[k];
      sp.t += dt*1.9;
      if (sp.vx !== undefined){ sp.x += sp.vx*dt; sp.y += sp.vy*dt; }
      if (sp.t >= 1) sparks.splice(k,1);
    }
    for (var b = bills.length-1; b >= 0; b--){
      var bl = bills[b];
      bl.t += dt*0.45;
      bl.y += bl.vy*dt;
      bl.x += Math.sin(time*3 + bl.sway)*0.012*W*dt*6;
      if (bl.t >= 1 || bl.y > G.tree.baseY + 0.08*H) bills.splice(b,1);
    }
  }

  // ---------- drawing ----------
  function text(lines, x, y, size, opts){
    opts = opts || {};
    ctx.font = (opts.weight || 400) +
               " " + size + "px 'Helvetica Neue', Helvetica, Arial, sans-serif";
    ctx.fillStyle = opts.color || COLORS.label;
    ctx.textAlign = opts.align || "left";
    ctx.textBaseline = "alphabetic";
    var lh = size*1.25;
    for (var i = 0; i < lines.length; i++)
      ctx.fillText(lines[i], x, y + i*lh);
  }

  function drawTrees(){
    for (var ti = 0; ti < G.trees.length; ti++)
      if (G.trees[ti].g > 0) drawOneTree(G.trees[ti], ti);
  }

  function drawOneTree(tr, ti){
    var s = W/1264, g = tr.g;
    var breathe = 1 + 0.015*Math.sin(time*1.4 + ti*1.3);
    var TH = tr.baseY - tr.canopyY; // trunk height: scales the whole tree
    // sprout from the ground where the idea was planted (easeOutBack)
    var c1 = 1.70158, c3 = c1 + 1;
    var k = 1 + c3*Math.pow(g-1,3) + c1*Math.pow(g-1,2);
    ctx.save();
    ctx.translate(tr.x, tr.baseY);
    ctx.scale(Math.max(0.001,k), Math.max(0.001,k));
    ctx.translate(-tr.x, -tr.baseY);
    // trunk (widths scale with R, vertical offsets with trunk height)
    ctx.fillStyle = COLORS.trunk;
    ctx.beginPath();
    ctx.moveTo(tr.x - tr.R*0.16, tr.baseY);
    ctx.bezierCurveTo(tr.x - tr.R*0.10, tr.baseY - 0.30*TH,
                      tr.x - tr.R*0.22, tr.canopyY + 0.30*TH,
                      tr.x - tr.R*0.065, tr.canopyY + 0.15*TH);
    ctx.lineTo(tr.x + tr.R*0.10, tr.canopyY + 0.15*TH);
    ctx.bezierCurveTo(tr.x + tr.R*0.22, tr.canopyY + 0.33*TH,
                      tr.x + tr.R*0.11, tr.baseY - 0.30*TH,
                      tr.x + tr.R*0.18, tr.baseY);
    ctx.closePath();
    ctx.fill();
    // canopy: clustered discs of money-green
    var blobs = [
      [0, -0.2, 1.00, COLORS.leaf1],
      [-0.75, 0.10, 0.72, COLORS.leaf2],
      [0.75, 0.12, 0.72, COLORS.leaf2],
      [-0.42, -0.62, 0.62, COLORS.leaf3],
      [0.45, -0.60, 0.62, COLORS.leaf3],
      [0, 0.30, 0.80, COLORS.leaf1]
    ];
    for (var i = 0; i < blobs.length; i++){
      var b = blobs[i];
      ctx.fillStyle = b[3];
      ctx.beginPath();
      ctx.arc(tr.x + b[0]*tr.R, tr.canopyY + b[1]*tr.R,
              b[2]*tr.R*breathe, 0, Math.PI*2);
      ctx.fill();
    }
    // little bills nested in the canopy (per-tree seed so each differs)
    var seedKeep = seed; seed = (42 + ti*101) >>> 0; if (seed === 0) seed = 1;
    for (i = 0; i < 6; i++){
      var bx = tr.x + (rng()-0.5)*tr.R*1.9;
      var by = tr.canopyY + (rng()-0.5)*tr.R*1.5;
      drawBill(bx, by, (rng()-0.5)*0.9, s);
    }
    seed = seedKeep;
    ctx.restore();
  }

  function drawBill(x, y, rot, s){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    var bw = 15*s, bh = 8.5*s;
    ctx.fillStyle = COLORS.bill;
    ctx.strokeStyle = COLORS.billHi;
    ctx.lineWidth = Math.max(0.8, 1*s);
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-bw/2, -bh/2, bw, bh, 1.5*s);
    else ctx.rect(-bw/2, -bh/2, bw, bh);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = COLORS.billHi;
    ctx.font = "700 " + (7*s) + "px 'Helvetica Neue', Helvetica, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("$", 0, 0.5*s);
    ctx.restore();
  }

  function drawBackdrop(){
    var s = W/1264;
    // gates
    for (var i = 0; i < G.gates.length; i++){
      var g = G.gates[i];
      ctx.fillStyle = g.color;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(g.x, g.y0, g.w, g.y1-g.y0, 3*s);
      else ctx.rect(g.x, g.y0, g.w, g.y1-g.y0);
      ctx.fill();
    }
    // titles
    text(["Idea Generation"], 0.038*W, 0.095*H, 22*s, { weight: 700 });
    text(["Idea Pitch","Workshop"], 0.490*W, 0.105*H, 22*s,
         { weight: 700, align: "center" });
    text(["Pitches +","Multivote"], 0.676*W, 0.165*H, 22*s,
         { weight: 700, align: "center" });
    // day strip: muted schedule line under each section title (>=20px font)
    var dayPx = Math.max(20, 21*s);
    text(["TUE 16 JUN · A1 due 23:59"], 0.038*W, 0.135*H, dayPx,
         { weight: 600, color: COLORS.caption });
    text(["WED 17 JUN · A2 13:30 · A3 16:30"], 0.490*W, 0.190*H, dayPx,
         { weight: 600, align: "center", color: COLORS.caption });
    text(["WED EVE → FRIDAY"], 0.676*W, 0.245*H, dayPx,
         { weight: 600, align: "center", color: COLORS.caption });
    text(["FRI 19 JUN"], G.tree.x, 0.245*H, dayPx,
         { weight: 600, align: "center", color: COLORS.caption });
    // logo above gate 1
    if (logoReady){
      var lw = 0.07875*W, lh = lw * (logo.height/logo.width);
      ctx.drawImage(logo, 0.288*W - lw/2 + G.gates[0].w/2, 0.015*H, lw, lh);
    }
    // captions
    text(["~200 ideas generated","individually (A1: 5 each + AI)"],
         0.135*W, 0.910*H, 19.5*s,
         { align: "center", color: COLORS.caption });
    text(["~40 sixty-second","pitches (A3)"], 0.390*W, 0.820*H, 19.5*s,
         { align: "center", color: COLORS.caption });
    text(["10 teams of 4 form","around the top ideas"],
         0.586*W, 0.740*H, 19.5*s,
         { align: "center", color: COLORS.caption });
    text(["10 refined","theses"], 0.747*W, 0.640*H, 19.5*s,
         { align: "center", color: COLORS.caption });
    text(["Final pitches Friday"], G.tree.x, 0.845*H, 20*s,
         { align: "center", color: COLORS.caption, weight: 600 });
    // live counters above each downstream cloud
    ctx.font = "600 " + (19.5*s) + "px 'Helvetica Neue', Helvetica, Arial, sans-serif";
    ctx.textAlign = "center";
    if (arrived[1] > 0){
      ctx.fillStyle = COLORS.gate1;
      ctx.fillText(arrived[1], 0.390*W, G.r1.y0 - 0.030*H);
    }
    if (arrived[2] > 0){
      ctx.fillStyle = COLORS.gate2;
      ctx.fillText(arrived[2], 0.586*W, G.r2.y0 - 0.030*H);
    }
    if (arrived[3] > 0){
      ctx.fillStyle = COLORS.gate3;
      ctx.fillText(arrived[3], 0.747*W, G.r3.y0 - 0.030*H);
    }
    drawTrees();
  }

  function drawDots(){
    var s = W/1264;
    ctx.lineWidth = Math.max(1, 1.3*s);
    for (var i = 0; i < dots.length; i++){
      var st = dotState(dots[i]);
      if (!st || st.alpha <= 0) continue;
      var r = G.radii[st.stage];
      ctx.globalAlpha = st.alpha * globalAlpha;
      if (st.gold){
        ctx.shadowColor = COLORS.gold;
        ctx.shadowBlur = r*2.6;
        ctx.fillStyle = COLORS.gold;
        ctx.strokeStyle = COLORS.gold;
      } else {
        ctx.fillStyle = COLORS.dotFill;
        ctx.strokeStyle = COLORS.dot;
      }
      ctx.beginPath();
      ctx.arc(st.x, st.y, r, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.stroke();
    }
    ctx.globalAlpha = globalAlpha;
  }

  function drawEffects(){
    var s = W/1264;
    for (var i = 0; i < puffs.length; i++){
      var pf = puffs[i];
      ctx.globalAlpha = (1-pf.t)*0.55*globalAlpha;
      ctx.strokeStyle = COLORS.puff;
      ctx.lineWidth = Math.max(1, 1.4*s);
      ctx.beginPath();
      ctx.arc(pf.x, pf.y, 4*s*(1+pf.t*3), 0, Math.PI*2);
      ctx.stroke();
    }
    for (var k = 0; k < sparks.length; k++){
      var sp = sparks[k];
      ctx.globalAlpha = (1-sp.t)*globalAlpha;
      ctx.fillStyle = sp.color;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, 3.2*s*(1-sp.t), 0, Math.PI*2);
      ctx.fill();
    }
    for (var b = 0; b < bills.length; b++){
      var bl = bills[b];
      ctx.globalAlpha = (1-bl.t)*globalAlpha;
      drawBill(bl.x, bl.y, bl.rot + Math.sin(time*2+bl.sway)*0.5, s);
    }
    ctx.globalAlpha = 1;
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = globalAlpha;
    drawBackdrop();
    drawDots();
    drawEffects();
    ctx.globalAlpha = 1;
  }

  function updateStats(){
    var planted = 0;
    for (var i = 0; i < G.trees.length; i++) if (G.trees[i].g > 0.05) planted++;
    statsEl.textContent =
      "200 ideas \u2192 " + arrived[1] + " pitches \u2192 " +
      arrived[2] + " teams \u2192 " + arrived[3] + " theses" +
      (planted > 0 ? " \u2192 " + planted + " planted" : "");
  }

  // ---------- loop ----------
  var last = null, running = true;
  var speedSteps = [1, 2, 0.5], speedIdx = 0;
  function frame(ts){
    if (!running) return;
    if (last === null) last = ts;
    var dt = Math.min(0.05, (ts-last)/1000) * speedSteps[speedIdx];
    last = ts;
    update(dt);
    draw();
    updateStats();
    requestAnimationFrame(frame);
  }
  function setRunning(on){
    running = on;
    playBtn.textContent = on ? "Pause" : "Play";
    if (on){ last = null; requestAnimationFrame(frame); }
  }
  playBtn.addEventListener("click", function(){ setRunning(!running); });
  speedBtn.addEventListener("click", function(){
    speedIdx = (speedIdx+1)%speedSteps.length;
    speedBtn.textContent = "Speed " + speedSteps[speedIdx] + "\u00D7";
  });
  replayBtn.addEventListener("click", function(){
    runCount++;
    buildCohort(1234 + runCount*7919);
    T = 0; globalAlpha = 1;
    updateStats();
    if (!running) setRunning(true);
  });

  // parent deck can pause/resume this iframe (reuses the Pause/Play path)
  window.addEventListener("message", function(e){
    if (e.data === "deck:pause"){ if (running) setRunning(false); }
    else if (e.data === "deck:play"){ if (!running) setRunning(true); }
  });

  // ---------- boot ----------
  var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  resize();
  buildCohort(1234);
  updateStats();
  if (reduceMotion){
    // static slide: jump to the moment all stages are populated
    T = DUR[0]+DUR[1]+DUR[2]+DUR[3]+DUR[4]+DUR[5]+DUR[6]+DUR[7]+1.0;
    arrived = [200, 40, 10, 10];
    for (var ti = 0; ti < G.trees.length; ti++){ G.trees[ti].g = 1; G.trees[ti].planted = true; }
    running = false;
    playBtn.textContent = "Play";
    draw();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
